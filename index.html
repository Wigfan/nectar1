<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Néctar — Mermeladas Artesanales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"DM Sans"', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FDFBF7',
                        warm: {
                            50: '#FAF8F5',
                            100: '#F5F1EB',
                            200: '#E8E4DE',
                            300: '#D4CFC7',
                            400: '#8A8580',
                            500: '#6B6660',
                            600: '#4A4640',
                            700: '#2D2A26',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Reset de tap highlight en móviles */
        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #FDFBF7;
            overscroll-behavior: none;
        }

        /* === Animación de flotación del frasco === */
        @keyframes flotar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }
        .jar-flotante {
            animation: flotar 3s ease-in-out infinite;
        }

        /* === Transiciones entre vistas === */
        .vista {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .vista-oculta {
            opacity: 0;
            transform: translateY(18px);
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; right: 0;
        }
        .vista-visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* === Animación de entrada escalonada (Landing) === */
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-entrada {
            opacity: 0;
            animation: aparecer 0.55s ease forwards;
        }
        .ret-1 { animation-delay: 0.08s; }
        .ret-2 { animation-delay: 0.2s; }
        .ret-3 { animation-delay: 0.36s; }
        .ret-4 { animation-delay: 0.52s; }
        .ret-5 { animation-delay: 0.66s; }

        /* === Acordeones con <details>/<summary> === */
        details { border-bottom: 1px solid #EBE7E1; }
        details:last-child { border-bottom: none; }

        details summary {
            list-style: none;
            cursor: pointer;
            padding: 17px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
            font-size: 0.938rem;
            color: #2D2A26;
            transition: color 0.25s ease;
            user-select: none;
        }
        details summary::-webkit-details-marker { display: none; }

        details summary::after {
            content: '+';
            font-size: 22px;
            font-weight: 300;
            line-height: 1;
            color: var(--accento, #8A8580);
            transition: transform 0.3s ease, color 0.25s ease;
        }
        details[open] summary::after {
            transform: rotate(45deg);
            color: var(--accento, #2D2A26);
        }
        details[open] summary {
            color: var(--accento, #2D2A26);
        }

        /* === Efecto presión en botones === */
        .btn-sabor {
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-sabor:active {
            transform: scale(0.97);
        }

        /* === Tabla nutricional === */
        .tabla-nutri { width: 100%; border-collapse: collapse; }
        .tabla-nutri tr:not(:last-child) { border-bottom: 1px solid #F0ECE5; }
        .tabla-nutri td { padding: 9px 0; font-size: 0.875rem; }
        .tabla-nutri td:last-child  { text-align: right; font-weight: 500; color: #2D2A26; }
        .tabla-nutri td:first-child { color: #8A8580; }

        /* === Respeto a prefers-reduced-motion === */
        @media (prefers-reduced-motion: reduce) {
            .jar-flotante { animation: none; }
            .anim-entrada  { animation: none; opacity: 1; }
            .vista         { transition: none; }
        }

        html { scroll-behavior: smooth; }
    </style>
</head>

<body class="bg-cream min-h-screen text-warm-700 font-body overflow-x-hidden">

    <!-- Contenedor principal de la SPA -->
    <div id="app" class="relative max-w-md mx-auto min-h-screen">

        <!-- ===================== VISTA 1: LANDING ===================== -->
        <section id="vista-landing" class="vista vista-visible px-7 pt-12 pb-10 min-h-screen flex flex-col" aria-label="Selección de sabor">

            <!-- Logo (reemplazá src="logo.png" por la ruta de tu archivo) -->
            <div class="flex justify-center mb-5 anim-entrada ret-1">
                <img src="logo.png" alt="Logo Néctar" class="w-28 h-auto object-contain">
            </div>

            <!-- Marca y slogan -->
            <header class="text-center mb-auto anim-entrada ret-2">
                <h1 class="font-display text-[3.2rem] font-bold text-warm-700 tracking-tight leading-none mb-3">
                    Néctar
                </h1>
                <p class="text-warm-400 text-[0.95rem] font-light tracking-wide">
                    Simple, Natural y nuestro
                </p>
            </header>

            <!-- Texto indicativo -->
            <p class="text-center text-warm-400 text-sm leading-relaxed max-w-[280px] mx-auto mb-9 anim-entrada ret-3">
                ¿Qué sabor tenés? Elegilo para ver los detalles.
            </p>

            <!-- Botones de selección de sabor -->
            <nav class="flex flex-col gap-3.5 anim-entrada ret-4" aria-label="Sabores disponibles">

                <!-- Durazno -->
                <button
                    class="btn-sabor flex items-center gap-4 px-5 py-[18px] rounded-2xl shadow-sm hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-300 focus-visible:ring-offset-2"
                    style="background-color:#FDF3EA; --tw-ring-offset-color:#FDFBF7;"
                    onclick="mostrarDetalle('durazno')"
                    aria-label="Ver mermelada de durazno"
                >
                    <span class="text-[1.75rem] leading-none flex-shrink-0">🍑</span>
                    <span class="text-lg font-medium text-warm-700 flex-1 text-left">Durazno</span>
                    <svg class="w-5 h-5 text-warm-300 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>

                <!-- Manzana -->
                <button
                    class="btn-sabor flex items-center gap-4 px-5 py-[18px] rounded-2xl shadow-sm hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-300 focus-visible:ring-offset-2"
                    style="background-color:#EEF6F1; --tw-ring-offset-color:#FDFBF7;"
                    onclick="mostrarDetalle('manzana')"
                    aria-label="Ver mermelada de manzana"
                >
                    <span class="text-[1.75rem] leading-none flex-shrink-0">🍎</span>
                    <span class="text-lg font-medium text-warm-700 flex-1 text-left">Manzana</span>
                    <svg class="w-5 h-5 text-warm-300 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>

                <!-- Frutilla -->
                <button
                    class="btn-sabor flex items-center gap-4 px-5 py-[18px] rounded-2xl shadow-sm hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-300 focus-visible:ring-offset-2"
                    style="background-color:#FDEEEE; --tw-ring-offset-color:#FDFBF7;"
                    onclick="mostrarDetalle('frutilla')"
                    aria-label="Ver mermelada de frutilla"
                >
                    <span class="text-[1.75rem] leading-none flex-shrink-0">🍓</span>
                    <span class="text-lg font-medium text-warm-700 flex-1 text-left">Frutilla</span>
                    <svg class="w-5 h-5 text-warm-300 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>

            </nav>

            <!-- Pie sutil -->
            <footer class="text-center mt-auto pt-12 anim-entrada ret-5">
                <p class="text-warm-300 text-[0.68rem] tracking-[0.18em] uppercase">Mermeladas Artesanales</p>
            </footer>

        </section>

        <!-- ===================== VISTA 2: DETALLE ===================== -->
        <section id="vista-detalle" class="vista vista-oculta px-7 pt-4 pb-12 min-h-screen flex flex-col" aria-label="Detalle de producto">

            <!-- Botón volver -->
            <button
                id="btn-volver"
                class="flex items-center gap-2 mb-4 py-2 px-1 text-sm font-medium transition-colors duration-200 focus:outline-none focus-visible:underline"
                style="color: var(--accento, #8A8580);"
                onclick="mostrarLanding()"
                aria-label="Volver a la selección de sabores"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                Volver
            </button>

            <!-- Frasco flotante -->
            <div class="flex justify-center mb-1 mt-2">
                <img
                    id="jar-imagen"
                    alt="Frasco de mermelada"
                    class="jar-flotante w-44 h-auto drop-shadow-sm"
                    src=""
                    width="176"
                >
            </div>

            <!-- Nombre del sabor -->
            <h2 id="detalle-nombre" class="font-display text-[1.85rem] font-semibold text-center mb-0.5 tracking-tight" style="color: var(--accento, #2D2A26);"></h2>
            <p class="text-warm-400 text-sm text-center mb-9 font-light">Mermelada Artesanal</p>

            <!-- Acordeones (solo Nutricional e Ingredientes) -->
            <div class="w-full max-w-sm mx-auto" style="--accento: var(--accento, #2D2A26);">

                <details>
                    <summary>Información Nutricional</summary>
                    <div id="acc-nutri" class="pb-5"></div>
                </details>

                <details>
                    <summary>Ingredientes</summary>
                    <div id="acc-ingre" class="pb-5"></div>
                </details>

            </div>

            <!-- Pie con logo chico -->
            <div class="mt-auto pt-10 flex flex-col items-center gap-2">
                <img src="logo.png" alt="Logo Néctar" class="w-14 h-auto object-contain opacity-60">
                <p class="text-warm-300 text-[0.68rem] tracking-[0.18em] uppercase">Néctar</p>
            </div>

        </section>

    </div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        // ──────────────────────────────────────────────
        // Base de datos de sabores
        // ──────────────────────────────────────────────
        const sabores = {
            durazno: {
                nombre: 'Durazno',
                colorAcento: '#C47D3A',
                colorAcentoClaro: '#FDF3EA',
                colorJar: '#E8A87C',
                colorJarOscuro: '#B87A4E',
                nutricional: [
                    ['Porción', '20 g (1 cda)'],
                    ['Calorías', '48 kcal'],
                    ['Carbohidratos', '12 g'],
                    ['Azúcares', '10 g'],
                    ['Fibra', '0.3 g'],
                    ['Sodio', '5 mg'],
                ],
                ingredientes: [
                    'Lata de durazno',
                    'Azúcar',
                    'Jugo de limón',
                    'Pectina natural (de manzana)',
                ],
            },
            manzana: {
                nombre: 'Manzana',
                colorAcento: '#527D5E',
                colorAcentoClaro: '#EEF6F1',
                colorJar: '#CDA24E',
                colorJarOscuro: '#A67C2E',
                nutricional: [
                    ['Porción', '20 g (1 cda)'],
                    ['Calorías', '42 kcal'],
                    ['Carbohidratos', '11 g'],
                    ['Azúcares', '9 g'],
                    ['Fibra', '0.5 g'],
                    ['Sodio', '3 mg'],
                ],
                ingredientes: [
                    'Manzanas rojas frescas',
                    'Azúcar',
                    'Jugo de limón',
                    'Canela molida (una pizca)',
                    'Pectina natural',
                ],
            },
            frutilla: {
                nombre: 'Frutilla',
                colorAcento: '#B84E47',
                colorAcentoClaro: '#FDEEEE',
                colorJar: '#D4726A',
                colorJarOscuro: '#B84E47',
                nutricional: [
                    ['Porción', '20 g (1 cda)'],
                    ['Calorías', '45 kcal'],
                    ['Carbohidratos', '11.5 g'],
                    ['Azúcares', '10 g'],
                    ['Fibra', '0.4 g'],
                    ['Sodio', '4 mg'],
                ],
                ingredientes: [
                    'Frutillas frescas',
                    'Azúcar',
                    'Jugo de limón',
                    'Pectina natural',
                ],
            },
        };

        // ──────────────────────────────────────────────
        // Generador de SVG del frasco (plano y minimal)
        // ──────────────────────────────────────────────
        function generarJarSVG(key) {
            const s = sabores[key];

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
                <!-- Sombra proyectada -->
                <ellipse cx="100" cy="268" rx="50" ry="6" fill="#E0DCD5" opacity="0.45"/>

                <!-- Cuerpo del frasco -->
                <path d="M64 86 L56 244 Q56 260 73 260 L127 260 Q144 260 144 244 L136 86 Z"
                      fill="#FFFFFF" stroke="#DDD8D0" stroke-width="1.2" stroke-linejoin="round"/>

                <!-- Brillo de vidrio (costado izquierdo) -->
                <path d="M68 90 L62 240 Q62 253 74 254 L79 254 L82 90 Z"
                      fill="#FFFFFF" opacity="0.55"/>

                <!-- Tapa metálica -->
                <rect x="58" y="66" width="84" height="24" rx="5" fill="#C5BFB5"/>
                <rect x="62" y="62" width="76" height="8" rx="3.5" fill="#D4CEC4"/>
                <line x1="66" y1="70" x2="134" y2="70" stroke="#B8B2A8" stroke-width="0.7"/>

                <!-- Mermelada (relleno de color) -->
                <path d="M64 152 L60 244 Q60 256 74 257 L126 257 Q140 256 140 244 L136 152 Z"
                      fill="${s.colorJar}"/>

                <!-- Reflejo sobre la mermelada -->
                <path d="M68 157 L65 238 Q65 250 76 251 L80 251 L83 157 Z"
                      fill="#FFFFFF" opacity="0.16"/>

                <!-- Etiqueta rectangular -->
                <rect x="72" y="172" width="56" height="50" rx="3.5" fill="#FFFFFF" opacity="0.93"/>
                <rect x="72" y="172" width="56" height="50" rx="3.5" fill="none" stroke="#EAE6DF" stroke-width="0.7"/>

                <!-- Texto de la etiqueta -->
                <text x="100" y="193" text-anchor="middle"
                      font-family="'Playfair Display',serif" font-size="13.5" font-weight="600"
                      fill="#2D2A26">Néctar</text>
                <line x1="84" y1="199" x2="116" y2="199" stroke="#EAE6DF" stroke-width="0.7"/>
                <text x="100" y="214" text-anchor="middle"
                      font-family="'DM Sans',sans-serif" font-size="9.5" font-weight="400"
                      fill="${s.colorJarOscuro}">${s.nombre}</text>
            </svg>`;

            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        // ──────────────────────────────────────────────
        // Referencias a las vistas
        // ──────────────────────────────────────────────
        const vistaLanding  = document.getElementById('vista-landing');
        const vistaDetalle  = document.getElementById('vista-detalle');
        let vistaActual     = 'landing';

        // ──────────────────────────────────────────────
        // Mostrar vista de detalle
        // ──────────────────────────────────────────────
        function mostrarDetalle(key) {
            const s = sabores[key];
            if (!s || vistaActual === 'detalle') return;

            // 1. Aplicar color de acento global (CSS custom property)
            document.documentElement.style.setProperty('--accento', s.colorAcento);

            // 2. Fondo sutil degradado superior en la vista detalle
            vistaDetalle.style.background =
                `radial-gradient(ellipse 80% 50% at 50% 0%, ${s.colorAcentoClaro} 0%, #FDFBF7 70%)`;

            // 3. Imagen del frasco
            const img = document.getElementById('jar-imagen');
            img.src = generarJarSVG(key);
            img.alt = 'Frasco de mermelada de ' + s.nombre;

            // 4. Nombre del sabor
            const nombreEl = document.getElementById('detalle-nombre');
            nombreEl.textContent = s.nombre;
            nombreEl.style.color = s.colorAcento;

            // 5. Botón volver
            document.getElementById('btn-volver').style.color = s.colorAcento;

            // 6. Inyectar tabla nutricional
            let tHTML = '<table class="tabla-nutri">';
            s.nutricional.forEach(function(fila) {
                tHTML += '<tr><td>' + fila[0] + '</td><td>' + fila[1] + '</td></tr>';
            });
            tHTML += '</table>';
            document.getElementById('acc-nutri').innerHTML = tHTML;

            // 7. Inyectar ingredientes
            let iHTML = '<ul class="space-y-2.5">';
            s.ingredientes.forEach(function(ing) {
                iHTML += '<li class="flex items-start gap-3 text-sm text-warm-400">'
                       + '<span class="w-1.5 h-1.5 rounded-full mt-[7px] flex-shrink-0" style="background-color:' + s.colorAcento + '"></span>'
                       + ing + '</li>';
            });
            iHTML += '</ul>';
            document.getElementById('acc-ingre').innerHTML = iHTML;

            // 8. Cerrar acordeones abiertos previamente
            vistaDetalle.querySelectorAll('details').forEach(function(d) {
                d.removeAttribute('open');
            });

            // 9. Transición de vistas
            vistaLanding.classList.remove('vista-visible');
            vistaLanding.classList.add('vista-oculta');

            setTimeout(function() {
                vistaDetalle.classList.remove('vista-oculta');
                vistaDetalle.classList.add('vista-visible');
                window.scrollTo({ top: 0, behavior: 'instant' });
                vistaActual = 'detalle';
            }, 160);
        }

        // ──────────────────────────────────────────────
        // Volver al landing
        // ──────────────────────────────────────────────
        function mostrarLanding() {
            if (vistaActual !== 'detalle') return;

            vistaDetalle.classList.remove('vista-visible');
            vistaDetalle.classList.add('vista-oculta');

            setTimeout(function() {
                vistaLanding.classList.remove('vista-oculta');
                vistaLanding.classList.add('vista-visible');
                window.scrollTo({ top: 0, behavior: 'instant' });
                vistaActual = 'landing';
            }, 160);
        }
    </script>

</body>
</html>
